<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizando Força 50</title><style>body{margin:0;background:#0e1116;color:#f4f7fa;font:16px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{max-width:420px;padding:28px;text-align:center}.spin{width:38px;height:38px;border:4px solid #29313d;border-top-color:#d7ff5f;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.mut{color:#97a1af;font-size:13px}</style></head>
<body><div class="box"><div class="spin"></div><h2>Atualizando o Força 50…</h2><div class="mut">Limpando apenas o cache antigo deste app.</div></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>String(r.scope).includes('/Servicos/forca50/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('forca50-')).map(k=>caches.delete(k)));
    }
  }catch(e){}
  const target='../forca50/?fresh='+Date.now();
  location.replace(target);
})();
</script></body></html>
